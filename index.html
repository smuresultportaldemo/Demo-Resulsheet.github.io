<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SMU Result Portal — Student Search</title>
<style>
:root{--navy:#19366b;--ink:#202938;--muted:#64718a;--line:#d7deea;--bg:#f0f3f8;--gold:#9a8665}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font:16px Arial,Helvetica,sans-serif;color:var(--ink)}
header{background:var(--navy);color:white;text-align:center;padding:22px 14px;border-bottom:5px solid var(--gold)}.logo{width:78px;height:78px;object-fit:contain;border-radius:50%;background:white;margin-bottom:9px}
header h1{font-size:clamp(20px,4vw,29px);margin:0}header p{margin:7px 0 0;color:#e1e9fb}
.notice{max-width:880px;margin:12px auto;padding:10px 13px;background:#fff5d7;border:1px solid #e6d49a;border-radius:6px;font-size:12px;line-height:1.5;color:#70540a}
main{max-width:880px;margin:18px auto;padding:0 12px 40px}.card{background:#fff;border:1px solid var(--line);border-radius:9px;padding:20px;box-shadow:0 4px 15px #1b2b4a0b}
h2{margin:0 0 15px;color:var(--navy);font-size:21px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
label{display:block;font-size:13px;font-weight:bold;margin-bottom:6px}input,select{width:100%;padding:12px;border:1px solid #c8d1e0;border-radius:6px;font-size:15px;background:#fff;color:var(--ink)}
button{margin-top:14px;background:var(--navy);color:white;border:0;border-radius:6px;padding:12px 17px;font-weight:bold;cursor:pointer}.status{margin-top:12px;font-size:14px;white-space:pre-wrap;line-height:1.5}
.sheet{margin-top:20px;background:white;border:1px solid #bac5d6}.sheethead{text-align:center;padding:22px 12px 16px;border-bottom:3px double var(--gold)}.sheethead h3{font-size:20px;color:var(--navy);margin:0 0 8px}.sheethead h2{margin:0 0 6px;font-size:23px}.sheethead p{margin:0;color:var(--muted);font-size:13px}
.body{padding:18px}.section{color:var(--navy);font-weight:bold;border-bottom:1px solid var(--line);padding-bottom:8px;margin:0 0 12px}
.details{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);margin-bottom:18px}.details div{padding:10px;border-bottom:1px solid var(--line);overflow-wrap:anywhere}.details div:nth-child(odd){background:#f5f7fb;font-weight:bold}.details div:nth-last-child(-n+2){border-bottom:0}
table{width:100%;border-collapse:collapse;margin:10px 0 16px;font-size:14px}th,td{border:1px solid #cbd4e2;padding:10px;text-align:left;overflow-wrap:anywhere}th{background:#edf2fa;color:#203b6b}
.pill{display:inline-block;background:#edf8f0;border:1px solid #b8d9c2;color:#176b37;border-radius:20px;padding:5px 10px;font-weight:bold;font-size:12px}.note{background:#f7f9fc;border:1px solid var(--line);padding:10px;border-radius:5px;font-size:12px;color:var(--muted);line-height:1.5}
.raw{white-space:pre-wrap;overflow-wrap:anywhere;background:#fafbfe;border:1px solid var(--line);padding:10px;font-size:13px;max-height:250px;overflow:auto}footer{text-align:center;color:var(--muted);font-size:12px;padding:20px}
@media(max-width:560px){.grid{grid-template-columns:1fr}.card{padding:15px}.body{padding:12px}.details{grid-template-columns:1fr 1fr}.details div{font-size:13px;padding:8px}}
@media print{body{background:#fff}.notice,.card,footer{display:none!important}main{margin:0;max-width:none;padding:0}.sheet{border:0}.body{padding:12px}}

/* Clearer, slightly thicker borders throughout the result sheet */
.sheet { border: 1.5px solid #aeb9c9; }
.details { border: 1.5px solid #aeb9c9; }
.details div { border-bottom: 1.5px solid #aeb9c9; }
table { border: 1.5px solid #aeb9c9; border-collapse: collapse; }
th, td { border: 1.5px solid #aeb9c9; }
.section { border-bottom: 1.5px solid #aeb9c9; }
@media print {
  .details, .details div, table, th, td, .sheet {
    border-color: #aeb9c9 !important;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }
}
</style></head><body>
<header><img class="logo" src="./assets/smu-logo.jpg" alt="SMU logo" onerror="this.src='./smu-logo.jpg'"><h1>SYLHET MEDICAL UNIVERSITY</h1><p>Examination &amp; Result Portal</p></header>
<div class="notice"><b>UNOFFICIAL DEMO.</b> This is not an official university website. Publish real student results only with authorization.</div>
<main><section class="card"><h2>Student Result Search</h2>
<div class="grid">
<div><label for="exam">Exam Name</label><select id="exam" required><option value="">Select examination</option><option>First Professional Examination</option><option>Second Professional Examination</option><option>Third Professional Examination</option><option>Final Professional Examination</option></select></div>
<div><label for="session">Session</label><select id="session" required><option value="">Select session</option><option>2024-2025</option><option>2025-2026</option><option>2026-2027</option></select></div>
<div><label for="serial">Serial Number</label><input id="serial" placeholder="Enter serial number" inputmode="numeric"></div>
<div><label for="reg">Registration Number</label><input id="reg" placeholder="Enter registration number" inputmode="numeric"></div>
</div>
<button id="search">Search Result</button><div id="status" class="status"></div></section><div id="results"></div></main>
<footer>SMU Result Portal Demo · Not affiliated with or endorsed by Sylhet Medical University</footer>
<script>
const INDEX_URL="./data/results.json";
const norm=s=>String(s||"").toLowerCase().normalize("NFKC").replace(/\s+/g," ").trim();
const normReg=s=>String(s||"").toUpperCase().normalize("NFKC").replace(/[^A-Z0-9]/g,"");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function locate(text,reg){const raw=String(text||""),target=normReg(reg);let flat="",pos=[];for(let i=0;i<raw.length;i++){const c=raw[i].toUpperCase();if(/[A-Z0-9]/.test(c)){flat+=c;pos.push(i)}}const at=flat.indexOf(target);if(at<0)return{row:"",context:""};const p=pos[at],l=raw.lastIndexOf("[",p),r=raw.indexOf("[",p+target.length);const start=l>=0&&p-l<180?l:Math.max(0,p-130);const end=r>=0&&r-p<260?r:Math.min(raw.length,p+260);return{row:raw.slice(start,end).replace(/--- PAGE \d+ ---/g,"").trim(),context:raw.slice(Math.max(0,p-200),Math.min(raw.length,p+300)).trim()}}
function parse(row,reg){let a=String(row||"").replace(/[\[\]]/g,"").split("|").map(x=>x.trim()).filter(Boolean);if(a.length&&/^\d{1,4}$/.test(a[0]))a.shift();let i=a.findIndex(x=>normReg(x).includes(normReg(reg)));if(i<0)i=a.findIndex(x=>normReg(x).length>=7);const name=i>=0?(a[i+1]||"Not confidently extracted"):"Not confidently extracted";const rest=i>=0?a.slice(i+2):[];const result=rest.find(x=>/pass|fail|promot|withheld|absent|supplement/i.test(x))||"Needs manual verification";return{registration:i>=0?a[i]:reg,name,result}}
document.getElementById("search").onclick=async()=>{
 const exam=document.getElementById("exam").value.trim();
 const session=document.getElementById("session").value.trim();
 const serial=document.getElementById("serial").value.trim();
 const reg=document.getElementById("reg").value.trim();
 const status=document.getElementById("status"),out=document.getElementById("results");out.innerHTML="";
 if(!exam||!session||!serial||!reg){status.textContent="Please select Exam Name and Session, and enter both Serial Number and Registration Number.";return}
 status.textContent="Loading…";
 try{
  const res=await fetch(INDEX_URL+"?v="+Date.now(),{cache:"no-store"});
  if(!res.ok)throw Error("Cannot load data/results.json (HTTP "+res.status+"). Check file path.");
  const data=await res.json();if(!Array.isArray(data))throw Error("results.json must be a JSON array.");
  const matches=data.filter(r=>norm(r.session)===norm(session)&&norm(r.exam)===norm(exam)&&normReg(r.text||"").includes(normReg(reg)));
  if(!matches.length){status.textContent="No matching result found. Check Exam Name, Session, Serial Number and Registration Number. Confirm that matching OCR data exists in results.json.";return}
  const verified=matches.map(r=>{const x=locate(r.text||"",reg),f=parse(x.row,reg);return {r,x,f}});
  const serialMatches=verified.filter(o=>{const first=String(o.x.row||"").replace(/^\s*\[?/,"").match(/^\s*(\d{1,5})/);return first&&first[1]===serial});
  const shown=serialMatches.length?serialMatches:verified;
  if(!serialMatches.length){status.textContent="Registration number found, but the entered serial number could not be verified from OCR. Showing the registration match; check the source PDF."; }
  else status.textContent="Record found. Please verify OCR-extracted details against the original PDF.";
  out.innerHTML=shown.map(({r,x,f})=>{
   const pass=/pass/i.test(f.result),fail=/fail/i.test(f.result),pill=pass?"<span class='pill'>PASSED</span>":fail?"<b style='color:#a21d2b'>FAILED</b>":esc(f.result);
   return `<article class="sheet"><div class="sheethead"><h3>${esc(r.exam||exam)}</h3><h2>RESULT SHEET</h2><p>Sylhet Medical University · Unofficial demo copy</p></div><div class="body"><p class="section">Student Information</p><div class="details"><div>Exam Name</div><div>${esc(r.exam||exam)}</div><div>Session</div><div>${esc(r.session||session)}</div><div>Serial Number (entered)</div><div>${esc(serial)}</div><div>Registration Number</div><div>${esc(reg)}</div><div>Student Name (OCR)</div><div>${esc(f.name)}</div><div>Result Status (OCR)</div><div>${pill}</div><div>Source PDF</div><div>${esc(r.sourceName||"OCR index")}</div></div><p class="section">Result Details</p><table><thead><tr><th>Serial No.</th><th>Registration Number</th><th>Student Name</th><th>Result</th></tr></thead><tbody><tr><td>${esc(serial)}</td><td>${esc(f.registration)}</td><td>${esc(f.name)}</td><td>${pill}</td></tr></tbody></table><div class="note">OCR can misread serial numbers, names, registration digits and result status. Verify all details against the original result sheet.</div><details style="margin-top:13px"><summary>Show OCR text for checking</summary><div class="raw">${esc(x.context||x.row)}</div></details><button onclick="window.print()">Print / Save as PDF</button></div></article>`;
  }).join("");
 }catch(e){status.textContent="Error: "+e.message;}
};
</script></body></html>
